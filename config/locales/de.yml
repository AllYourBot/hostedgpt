          take_me_to_billing: "direkt zur Abrechnung"
          take_me_to_plans: "direkt zu den Plänen"
          openai:
            step1_html: "Registrieren Sie sich für die %{link} von OpenAI. Sie können sich mit Ihrem ChatGPT-Konto anmelden."
            step2_html: "Klicken Sie links auf \"API Keys\" (oder %{link})."
            step3: "Bestätigen Sie Ihre Telefonnummer."
            step4_html: "Klicken Sie auf \"Create new secret key\", benennen Sie ihn zum Beispiel \"%{name}\" und fügen Sie ihn unten ein."
            step5_html: "Stellen Sie sicher, dass die Abrechnung eingerichtet ist, indem Sie auf \"Settings\" und \"Billing\" klicken (oder %{link})."
            step6: "Fügen Sie eine \"Payment method.\" hinzu."
          anthropic:
            step1_html: "Registrieren Sie sich für die Web-%{link} von Anthropic."
            step2_html: "Klicken Sie oben rechts auf Ihr Profil und wählen Sie \"API Keys\" (oder %{link})."
            step3_html: "Klicken Sie auf \"Create Key\" und benennen Sie ihn zum Beispiel \"%{name}\"."
            step4: "Klicken Sie auf \"Copy key\" und fügen Sie ihn unten ein."
            step5_html: "Klicken Sie dann auf Ihr Profil und wählen Sie \"Plans & Billing\" (oder %{link})."
            step6: "Klicken Sie auf \"Claim\", falls Sie kostenloses Guthaben haben, oder andernfalls auf \"Select Plan\" und wählen Sie einfach den \"Build\"-Plan."
          groq:
            step1_html: "Erstellen Sie ein Konto in der %{link} und melden Sie sich an."
            step2_html: "Klicken Sie links auf \"API Keys\" (oder %{link})."
            step3_html: "Klicken Sie auf \"Create API Key\", benennen Sie ihn zum Beispiel \"%{name}\" und fügen Sie ihn unten ein."
          openrouter:
            step1_html: "Erstellen Sie ein Konto auf %{link} und melden Sie sich an."
            step2_html: "Klicken Sie links auf \"Keys\" (oder %{link})."
            step3_html: "Klicken Sie auf \"Create Key\", benennen Sie ihn zum Beispiel \"%{name}\" und fügen Sie ihn unten ein."
            step4_html: "Fügen Sie Ihrem Konto Guthaben hinzu, indem Sie auf \"Credits\" klicken (oder %{link}). OpenRouter verwendet ein Guthabensystem, kein Abonnement."
          gemini:
            step1: "Stellen Sie sicher, dass Sie ein Google-/Gmail-Konto haben und angemeldet sind."
            step2_html: "Besuchen Sie %{link}."
            step3_html: "Klicken Sie links auf \"Get API Key\" (oder %{link})."
            step4: "Klicken Sie auf \"Create API Key\" und sobald er erscheint auf \"Copy\", und fügen Sie ihn unten ein."
            step5: "Klicken Sie nach dem Schließen des Dialogs rechts neben dem Schlüssel auf \"Go to billing\"."
            step6: "Nach der Annahme der Google-Cloud-Bedingungen sehen Sie wahrscheinlich \"This project has no billing account.\" Klicken Sie in diesem Fall auf \"Link a billing account\" und dann auf \"Create billing account.\" Folgen Sie den Anweisungen, um es einzurichten. Sie erhalten in der Regel 300 $ kostenloses Guthaben, das innerhalb der ersten 90 Tage genutzt werden kann."
            step7_html: "Google bietet weitere, deutlich verwirrendere Möglichkeiten, einen API-Schlüssel direkt über Google Cloud zu erstellen. Falls Sie das aus irgendeinem Grund trotzdem probieren möchten, finden Sie einige Hinweise unter %{link}."
          brave:
            step1_html: "Registrieren Sie sich für die %{link} und wählen Sie einen Plan (eine kostenlose Stufe ist verfügbar)."
            step2_html: "Gehen Sie zu %{link}."
            step3_html: "Klicken Sie auf \"Add API key\", benennen Sie ihn zum Beispiel \"%{name}\" und fügen Sie ihn unten ein."
