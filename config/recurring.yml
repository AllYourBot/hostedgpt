# SolidQueue's scheduler process loads this file (bin/rake solid_queue:start, or the Puma plugin).
run_due_scheduled_prompts:
  class: RunDueScheduledPromptsJob
  schedule: every minute

# SolidQueue keeps finished jobs until something clears them; this drops those older than a day.
clear_finished_jobs:
  command: "SolidQueue::Job.clear_finished_in_batches"
  schedule: every hour
